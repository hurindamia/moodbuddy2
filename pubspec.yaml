name: moodbuddy2
description: MoodBuddy2 - mental health support UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  google_fonts: ^5.0.0
  fl_chart: ^0.66.0
  url_launcher: ^6.3.2
  geolocator: ^10.1.0
  youtube_player_flutter: ^9.0.3

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.10
  image_picker: ^1.0.4
  pdf: ^3.10.7
  printing: ^5.11.1
  table_calendar: ^3.0.9
  intl: ^0.19.0
  http: ^1.2.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/psychologists/

  fonts:
    - family: TwCen
      fonts:
        - asset: assets/fonts/TWCenMT.ttf
          weight: 700